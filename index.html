<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 24 Tracker</title>
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The 24">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: mission control. Slim pinned bar, one hero scoreboard, one thumb-reach tab bar, one screen per job. */
:root{
  --bg:#0a0d12;
  --panel:#151b25;
  --panel2:#1d2531;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --ink:#f5f0e8;
  --mute:#9aa4b3;
  --scar:#ff2e4d;
  --ember:#ffb02e;
  --ok:#3fd89a;
  --bad:#ff6b6b;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(800px 520px at 90% -8%,rgba(255,46,77,.20),transparent 62%),
    radial-gradient(640px 520px at -12% 38%,rgba(255,176,46,.08),transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/100% 44px,
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;
}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* pinned bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:rgba(10,13,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.04em}
.brand i{font-style:normal;color:var(--scar)}
.mini{margin-left:auto;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sync{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.1em;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute)}
.sync.live{color:var(--ok);border-color:rgba(63,216,154,.4)}
.sync.live::before{background:var(--ok);box-shadow:0 0 0 0 rgba(63,216,154,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(63,216,154,0)}100%{box-shadow:0 0 0 0 rgba(63,216,154,0)}}

/* rep alarm bar */
.alarm{position:sticky;top:calc(46px + env(safe-area-inset-top));z-index:35;margin:0 16px;display:none;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line2)}
.alarm.on{display:flex}
.alarm.hit{animation:flash .9s 3;border-color:var(--scar)}
@keyframes flash{50%{background:rgba(255,46,77,.35)}}
.alarm .al-t{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.alarm .al-c{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.alarm .al-s{flex:1;font-size:13px;color:var(--mute);line-height:1.2}
.alarm button{border:1px solid var(--line2);background:var(--panel2);border-radius:99px;min-height:34px;padding:0 12px;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.08em}
.alarm button.sndon{background:var(--ember);color:#241600;border-color:var(--ember)}

main{padding:4px 16px 0}
h2{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em;margin:22px 0 10px;text-transform:uppercase}
h2 small{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--mute);margin-left:8px}
h3{font-family:var(--cond);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
.note{color:var(--mute);font-size:14px;margin:8px 0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.list{display:flex;flex-direction:column;gap:10px}

/* hero */
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-top:12px}
.ringbox{position:relative;width:150px;height:150px}
.ringbox svg{display:block}
.ringbox .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.rc span{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.hl{font-family:var(--cond);font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--scar);text-transform:uppercase}
.bigclock{font-family:var(--display);font-size:clamp(42px,12.5vw,70px);line-height:1;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.kick{font-family:var(--cond);font-weight:600;letter-spacing:.1em;font-size:13px;color:var(--mute);text-transform:uppercase}
.strip{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:12px}
.strip i{height:12px;border-radius:3px;background:var(--panel2)}
.strip i.past{background:var(--scar)}
.strip i.now{background:var(--ember);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.slab{display:flex;justify-content:space-between;font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--mute);margin-top:4px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{padding:10px 12px}
.tile .k{font-family:var(--cond);font-weight:600;letter-spacing:.12em;font-size:11px;color:var(--mute);text-transform:uppercase}
.tile .v{font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;color:var(--mute)}

.row{padding:12px 14px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rn{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em}
.rv{font-family:var(--cond);font-weight:500;font-size:18px;color:var(--mute);margin:2px 0 8px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rv b{color:var(--ink);font-weight:700;font-size:26px}
.rv small{font-size:14px}
.rv .need{font-size:14px;letter-spacing:.04em}
.bar{position:relative;height:10px;background:rgba(255,255,255,.07);border-radius:99px;overflow:visible}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--scar),var(--ember));border-radius:99px;max-width:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.full i{background:var(--ok)}
.bar b{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.75;border-radius:2px}
.pill{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.1em;border-radius:99px;padding:2px 9px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(63,216,154,.45)}
.pill.warn{color:var(--ember);border-color:rgba(255,176,46,.5)}
.pill.bad{color:var(--bad);border-color:rgba(255,107,107,.5)}
.pill.done{background:var(--ok);color:#06241a;border-color:var(--ok)}

.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--cond);font-weight:700;font-size:20px;transition:transform .08s}
.btns button.plus{background:linear-gradient(180deg,#ff4561,#e0173a);border-color:#ff6a80;color:#fff;box-shadow:0 4px 14px rgba(255,46,77,.3)}
.btns button.minus{flex:0 0 64px;color:var(--mute)}
.btns button:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.stick{position:sticky;top:calc(46px + env(safe-area-inset-top));z-index:30;background:rgba(10,13,18,.92);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line)}
.chip{flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.03em}
.chip.on{background:var(--scar);border-color:var(--scar);color:#fff}
.who-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 4px}
.who-line .big{font-family:var(--display);font-size:36px;text-transform:uppercase;line-height:1}
.who-line span{color:var(--mute);font-size:14px}
.setcard{display:flex;gap:12px;align-items:center;margin:8px 0 12px;border-color:rgba(255,176,46,.35)}
.setcard .sc-t{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--ember);text-transform:uppercase}
.setcard .sc-b{font-family:var(--cond);font-weight:700;font-size:21px}
.setcard .sc-b span{color:var(--mute);font-weight:500;font-size:15px}
.custom{display:flex;gap:8px;margin-top:8px}
.custom input{flex:1;min-width:0;min-height:44px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:0 12px;font:500 16px var(--body)}
.custom button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.custom button.sub{color:var(--mute)}
.cta{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin-top:12px}
textarea.copybox{width:100%;min-height:150px;margin-top:10px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:10px;font:14px/1.4 var(--body)}

/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.fi:last-child{border-bottom:0}
.fi b{font-family:var(--cond);font-weight:700;font-size:16px}
.fi .ft{margin-left:auto;font-family:var(--cond);font-size:13px;color:var(--mute);white-space:nowrap}
.fi.fresh{animation:slide .5s}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}

/* watch */
.watch{border-color:rgba(255,176,46,.4);background:linear-gradient(180deg,rgba(255,176,46,.10),rgba(255,176,46,.03))}
.watch .w-t{font-family:var(--cond);font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--ember);text-transform:uppercase}
.watch p{margin:4px 0 0;font-size:15px}

/* team */
.rank{display:grid;grid-template-columns:30px 1fr 54px;gap:10px;align-items:center;padding:10px 12px}
.rank .n{font-family:var(--display);font-size:24px;color:var(--mute);text-align:center}
.rank.r1 .n{color:var(--ember)}
.rank .nm button{background:none;border:0;padding:0;font-family:var(--cond);font-weight:700;font-size:20px;color:var(--ink)}
.rank .pc{font-family:var(--display);font-size:22px;text-align:right}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:560px;font-family:var(--cond)}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
th{font-weight:600;letter-spacing:.08em;color:var(--mute);font-size:12px;text-transform:uppercase}
td.nm{text-align:left;padding-left:12px;font-weight:700;font-size:17px}
td.c{background:linear-gradient(to top,rgba(255,46,77,.55) calc(var(--p) * 100%),transparent 0)}
td.tot{font-weight:700}
tr:last-child td{border-bottom:0}

/* games */
.setups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.su{padding:12px}
.su .su-t{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.su .su-w{font-family:var(--display);font-size:26px;text-transform:uppercase;margin:2px 0}
.su .su-s{font-family:var(--cond);font-size:15px;color:var(--ember);font-variant-numeric:tabular-nums}
.su select{width:100%;min-height:40px;margin-top:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:0 8px}
.su button{width:100%;min-height:40px;margin-top:6px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.game{padding:12px 14px}
.game.won{border-color:rgba(63,216,154,.5);background:linear-gradient(180deg,rgba(63,216,154,.14),rgba(63,216,154,.04))}
.game .rule{color:var(--mute);font-size:15px;margin:2px 0 8px}
.game .est{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.seg button{flex:1 1 140px;min-height:42px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);padding:6px 10px;font-weight:500;font-size:14px}
.seg button.on{border-color:var(--scar);background:rgba(255,46,77,.22);color:#fff}
.gtools{display:flex;gap:8px;align-items:center;margin-top:8px}
.gtools .tm{flex:1;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.gtools .tm{line-height:1}.gtools .tm small{display:block;font-family:var(--cond);font-size:12px;letter-spacing:.12em;color:var(--mute);margin-top:3px}
.gtools button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.grow{display:flex;gap:8px;align-items:center;margin-top:8px}
.grow select{flex:1;min-height:46px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:0 10px}
.grow button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.grow button.go{background:linear-gradient(180deg,#ff4561,#e0173a);border-color:#ff6a80;color:#fff}
.won .grow button.go{background:var(--ok);border-color:var(--ok);color:#06241a}

/* fuel */
.macro{display:grid;grid-template-columns:1fr repeat(4,54px);gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--cond);font-size:17px}
.macro:last-child{border-bottom:0}
.macro.h{font-size:12px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;font-weight:600}
.macro span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.macro.t{font-weight:700;font-size:19px}
.mbars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.mb{display:grid;grid-template-columns:70px 1fr 100px;gap:8px;align-items:center;font-family:var(--cond);font-size:16px}
.mb em{font-style:normal;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}

/* map */
.mapbox{overflow:hidden;padding:0}
.mapbox svg{display:block;width:100%;height:auto}
.stop{padding:12px 14px;display:grid;grid-template-columns:36px 1fr;gap:4px 12px}
.stop.got{border-color:rgba(63,216,154,.5);background:linear-gradient(180deg,rgba(63,216,154,.14),rgba(63,216,154,.04))}
.stop .no{grid-row:span 3;width:36px;height:36px;border-radius:50%;background:var(--scar);color:#fff;font-family:var(--display);display:flex;align-items:center;justify-content:center;font-size:19px}
.stop.got .no{background:var(--ok);color:#06241a}
.stop .meta{color:var(--mute);font-size:14px}
.stop .meta b{color:var(--ink);font-weight:600}
.open{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.open.y{color:var(--ok)} .open.s{color:var(--ember)} .open.n{color:var(--bad)}
.stop .acts{display:flex;gap:8px;margin-top:6px}
.stop .acts a,.stop .acts button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.stop .acts a.dir{background:linear-gradient(180deg,#ff4561,#e0173a);border-color:#ff6a80;color:#fff}
a.route{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;background:linear-gradient(180deg,#ff4561,#e0173a);color:#fff;text-decoration:none;font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin-top:12px}

/* plan */
.plan{display:flex;flex-direction:column;gap:8px}
.ph{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:10px 12px}
.ph .pt{font-family:var(--display);font-size:20px;line-height:1.1}
.ph .pt small{display:block;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--mute)}
.ph h3{font-size:18px}
.ph p{margin:2px 0 0;color:var(--mute);font-size:14px}
.ph.now{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 8px 24px rgba(255,176,46,.15)}
.ph.past{opacity:.5}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,13,18,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.navin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
nav button{min-height:52px;border:0;border-radius:12px;background:none;color:var(--mute);font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
nav button.on{color:#fff;background:var(--panel2);box-shadow:inset 0 -3px 0 var(--scar)}
@media (max-width:380px){.hero{grid-template-columns:1fr}.ringbox{margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e4d"/><stop offset="1" stop-color="#ffb02e"/></linearGradient></defs></svg>
<canvas id="fx"></canvas>
<div class="app">
  <header class="top">
    <span class="brand">THE <i>24</i></span>
    <span class="mini" id="mc">--:--:--</span>
    <span class="sync" id="sync">OFFLINE</span>
  </header>
  <div class="alarm" id="alarm">
    <div><div class="al-t">Next set</div><div class="al-c" id="alc">15:00</div></div>
    <div class="al-s" id="als"></div>
    <button id="snd" data-a="snd">SOUND OFF</button>
  </div>
  <main id="main"></main>
</div>
<nav><div class="navin" id="nav"></div></nav>

<script>
"use strict";
var DBURL = 'https://the24hrchallenge-f1ad2-default-rtdb.firebaseio.com';
var ROOT = 'c24';
var START = Date.parse('2026-11-24T12:00:00-05:00');
var DUR = 24 * 3600 * 1000;
var HOUR = 3600 * 1000;
var PEOPLE = ['Sriram','Ryan','Prashanth','Ashvik','Atharva','Rishik','Ishaan'];
var ORIGIN = '42 Biel Rd W, New Brunswick, NJ 08901';

var GOALS = [

      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); queue.shift(); setSync(true); next(); })

    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(j){ setSync(true); if (!queue.length) applyRemote(j); })

var actx = null;

}

}

var parts = [], fxRun = false;
function confetti(n){
  var cv = document.getElementById('fx');
  cv.width = window.innerWidth * (window.devicePixelRatio || 1); cv.height = window.innerHeight * (window.devicePixelRatio || 1);
  var cols = ['#ff2e4d','#ffb02e','#f5f0e8','#3fd89a','#ff6a80'];
  for (var i = 0; i < n; i++) parts.push({x:cv.width / 2, y:cv.height * 0.35, vx:(Math.random() - 0.5) * 22, vy:-Math.random() * 20 - 4, s:5 + Math.random() * 7, c:cols[i % cols.length], r:Math.random() * 6, vr:(Math.random() - 0.5) * 0.4, life:110 + Math.random() * 60});

}
function stepFx(){
  var cv = document.getElementById('fx'), cx = cv.getContext('2d'), k = window.devicePixelRatio || 1;
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(function(p){ return p.life > 0 && p.y < cv.height + 40; });
  parts.forEach(function(p){
    p.x += p.vx * k * 0.5; p.y += p.vy * k * 0.5; p.vy += 0.55; p.vx *= 0.99; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1, p.life / 40);
    cx.fillRect(-p.s * k / 2, -p.s * k / 4, p.s * k, p.s * k / 2); cx.restore();
  });
  if (parts.length) requestAnimationFrame(stepFx); else { fxRun = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---------- status text ---------- */
function statusText(){
  var t = Date.now(), left;
  if (t < START) left = 'starts Tue 12 PM';
  else { var ms = Math.max(0, START + DUR - t); left = Math.floor(ms / 3600000) + 'h ' + pad(Math.floor((ms % 3600000) / 60000)) + 'm left'; }
  var lines = ['THE 24 · ' + left + ' · team ' + Math.round(teamPct() * 100) + '%'];
  GOALS.forEach(function(g){
    var sc = g.scale || 1, tot = g.per * PEOPLE.length;
    lines.push(g.name.replace(' (no bodyweight)', '') + ': ' + fmt(teamVal(g) * sc, g) + '/' + fmt(tot * sc, g));
  });
  lines.push('Games: ' + gamesDone() + '/' + GAMES.length);
  var low = PEOPLE.slice().sort(function(a, b){ return personPct(a) - personPct(b); }).slice(0, 2);
  lines.push('Furthest behind: ' + low.join(', '));
  return lines.join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-a]');
  if (!t) return;
  var a = t.getAttribute('data-a');
  if (a === 'nav') { view = t.getAttribute('data-v'); render(); window.scrollTo(0, 0); if (view === 'plan') { var n = document.getElementById('plan-now'); if (n) n.scrollIntoView({block:'center'}); } }
  else if (a === 'who') { me = t.getAttribute('data-p'); persist(); render(); }
  else if (a === 'who2') { me = t.getAttribute('data-p'); persist(); view = 'me'; render(); window.scrollTo(0, 0); }
  else if (a === 'custom') {
    var cid = t.getAttribute('data-g'), inp = document.getElementById('cin-' + cid), cg = GOAL_OF[cid];
    var raw = inp ? Number(inp.value) : 0;
    if (isFinite(raw) && raw > 0) {
      var amt = cg.id === 'pizza' ? raw : raw;
      addReps(me, cid, Number(t.getAttribute('data-s')) * (cg.dec ? r1(amt) : Math.round(amt)));
      inp.value = '';
      render();
    }
  }
  else if (a === 'inc') { addReps(me, t.getAttribute('data-g'), Number(t.getAttribute('data-d'))); render(); }
  else if (a === 'gopt') { var gm = GAME_OF[t.getAttribute('data-g')]; patchGame(gm.id, {opt: gm.opts[Number(t.getAttribute('data-i'))]}); render(); }
  else if (a === 'gdone') {
    var id = t.getAttribute('data-g'), cur = S.games[id] || {};
    if (cur.done) patchGame(id, {done:false, end:null}); else patchGame(id, {done:true, end:Date.now(), start: cur.start || null});
    render();
  }
  else if (a === 'gstart') { patchGame(t.getAttribute('data-g'), {start:Date.now()}); render(); }
  else if (a === 'gstop') { patchGame(t.getAttribute('data-g'), {start:null}); render(); }
  else if (a === 'gtry') { var gi = t.getAttribute('data-g'), c2 = S.games[gi] || {}; patchGame(gi, {tries: (c2.tries || 0) + 1}); render(); }
  else if (a === 'stop') { toggleStop(t.getAttribute('data-s')); render(); }
  else if (a === 'rotate') {
    var k = t.getAttribute('data-k'), cur2 = S.setups[k], idx = cur2 ? PEOPLE.indexOf(cur2.who) : -1;
    var other = S.setups[k === 'A' ? 'B' : 'A'], nxt = null;
    for (var i = 1; i <= PEOPLE.length; i++) { var cand = PEOPLE[(idx + i) % PEOPLE.length]; if (!other || other.who !== cand) { nxt = cand; break; } }
    setSetup(k, nxt); render();
  }
  else if (a === 'snd') {
    audioOn = !audioOn;
    if (audioOn) { try { var AC = window.AudioContext || window.webkitAudioContext; if (!actx) actx = new AC(); if (actx.state === 'suspended') actx.resume(); chime(); } catch(err){ audioOn = false; } }
    alarmTick();
  }
  else if (a === 'copy') {
    var txt = statusText(), out = document.getElementById('copyout');
    var show = function(){ out.innerHTML = '<textarea class="copybox" id="cbox" readonly></textarea>'; var box = document.getElementById('cbox'); box.value = txt; box.focus(); box.select(); };
    try { navigator.clipboard.writeText(txt).then(function(){ out.innerHTML = '<p class="note">Copied. Paste it in the group chat.</p>'; }, show); } catch (err) { show(); }
  }
});
document.addEventListener('change', function(e){
  var sel = e.target.closest('select');
  if (!sel) return;
  if (sel.hasAttribute('data-by')) { var id = sel.getAttribute('data-by'); patchGame(id, {by: sel.value || null}); }
  else if (sel.hasAttribute('data-setup')) { setSetup(sel.getAttribute('data-setup'), sel.value || null); render(); }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });

/* ---------- boot ---------- */
(function(){
  var m = lsGet('c24:me');
  if (m && PEOPLE.indexOf(m) > -1) me = m;
  S = cleanAll(null);
  render();
  setInterval(tick, 1000);
  setInterval(function(){ if (view === 'hq' || view === 'plan') { var y = window.scrollY; render(); window.scrollTo(0, y); } }, 30000);
  poll();
})();
</script>
